<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schaufenster – 3D Modell</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#20232a}
    main{display:flex;flex-direction:column;height:100dvh}
    header{padding:14px 20px;background:white;border-bottom:1px solid #ddd}
    h1{font-size:18px;margin:0 0 5px}p{font-size:13px;margin:0;color:#666}
    model-viewer{width:100%;flex:1;min-height:300px;background:linear-gradient(#fafafa,#e3e8ee)}
    footer{background:white;padding:10px 20px;font-size:12px;color:#555}
    .error{display:none;color:#a11;padding:8px 20px;background:#fff1f1}
  </style>
</head>
<body>
<main>
<header><h1>Schaufenster · 3D Galerie</h1><p>用滑鼠拖曳旋轉 · 滾輪縮放 · 右鍵拖曳移動</p></header>
<div id="error" class="error">模型無法載入。請確認 GitHub 儲存庫根目錄中有檔案「3D-Modell.glb」，大小寫必須完全一致。</div>
<model-viewer id="viewer" src="./3D-Modell.glb" alt="Schaufenster Galerie 3D Modell" camera-controls auto-rotate shadow-intensity="0.8" exposure="1" interaction-prompt="auto" loading="eager">
</model-viewer>
<footer>Schaufenster 3D · Konzeptmodell (Maße und Glasradien vor Ort prüfen)</footer>
</main>
<script>
const v=document.getElementById('viewer');
v.addEventListener('error',()=>document.getElementById('error').style.display='block');
</script>
</body>
</html>
